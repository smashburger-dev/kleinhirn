# Publishes the prebuilt device page in pages/ to GitHub Pages.
# There is no build step: pages/ is generated by tools/export_public.mjs in
# the source repository and uploaded unchanged.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v5
